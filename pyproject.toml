[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-create-agent-example"
version = "0.1.0"
description = "A small learning example for LangChain create_agent with Python."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
langchain-create-agent-example = "langchain_create_agent_example.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
